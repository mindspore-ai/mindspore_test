#operator add_scalar
add_scalar:
  args:
    input:
      dtype: tensor
      type_cast: number
    other:
      dtype: number
      disable_tensor_to_scalar: True
    alpha:
      dtype: number
      default: 1
  returns:
    output:
      dtype: tensor
  class:
    name: AddScalar
  dispatch:
    enable: True
    Ascend: AddScalarAscend
