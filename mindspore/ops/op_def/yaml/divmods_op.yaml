#operator divmods
divmods:
    args:
        input:
            dtype: tensor
        other:
            dtype: number
            disable_tensor_to_scalar: True
        rounding_mode:
            dtype: int
            default: None
            arg_handler: str_to_enum
    returns:
        output:
            dtype: tensor
    class:
        name: DivMods
    function:
        disable: True
    dispatch:
        enable: True
        Ascend: DivModsAscend
