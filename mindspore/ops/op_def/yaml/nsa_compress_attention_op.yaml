# operator nsa_compress_attention
nsa_compress_attention:
  args:
    query:
      dtype: tensor
    key:
      dtype: tensor
    value:
      dtype: tensor
    scale_value:
      dtype: float
    head_num:
      dtype: int
    compress_block_size:
      dtype: int
    compress_stride:
      dtype: int
    select_block_size:
      dtype: int
    select_block_count:
      dtype: int
    topk_mask:
      dtype: tensor
      default: None
    atten_mask:
      dtype: tensor
      default: None
    actual_seq_qlen:
      dtype: tuple[int]
      type_cast: list[int]
      default: None
    actual_cmp_seq_kvlen:
      dtype: tuple[int]
      type_cast: list[int]
      default: None
    actual_sel_seq_kvlen:
      dtype: tuple[int]
      type_cast: list[int]
      default: None
  returns:
    attention_out:
      dtype: tensor
    topk_indices_out:
      dtype: tensor
    softmax_max_out:
      dtype: tensor
    softmax_sum_out:
      dtype: tensor
  function:
    name: nsa_compress_attention
  dispatch:
    enable: True
    Ascend: NsaCompressAttentionAscend
