#operator signal_wait_until
signal_wait_until:
  args:
    depend_target:
      dtype: tensor
    signal:
      dtype: tensor
    signal_offset:
      dtype: tensor
    compare_value:
      dtype: tensor
    compare_op:
      dtype: int
      default: "'eq'"
      arg_handler: str_to_enum
  returns:
    output:
      dtype: tensor
      inplace: depend_target
  dispatch:
    enable: False