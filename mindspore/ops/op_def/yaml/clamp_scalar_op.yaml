#operator clamp
clamp_scalar:
    args:
        input:
            dtype: tensor
        min:
            dtype: number
            disable_tensor_to_scalar: True
            default: None
        max:
            dtype: number
            disable_tensor_to_scalar: True
            default: None
    returns:
        output:
            dtype: tensor
    class:
        name: ClampScalar
    dispatch:
        enable: True
        CPU: ClampScalarCPU
        GPU: ClampScalarGPU
