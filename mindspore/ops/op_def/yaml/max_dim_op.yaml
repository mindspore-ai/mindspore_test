#operator max_dim
max_dim:
  args:
    input:
      dtype: tensor
    dim:
      dtype: int
      disable_tensor_to_scalar: True
    keepdim:
      dtype: bool
      default: False
  returns:
    values:
      dtype: tensor
    index:
      dtype: tensor
  function:
    disable: True
  dispatch:
    enable: True
