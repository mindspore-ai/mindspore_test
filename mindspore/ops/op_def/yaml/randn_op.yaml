#operator randn
randn:
    args:
        shape:
            dtype: tuple[int]
            type_cast: list[int]
        seed:
            dtype: tensor
        offset:
            dtype: tensor
        dtype:
            dtype: TypeId
            arg_handler: dtype_to_type_id
            default: None
        device:
            dtype: int
            arg_handler: str_to_enum
            default: None
    returns:
        output:
            dtype: tensor
    function:
        disable: True
    composite: True
    dispatch:
        enable: True
        Ascend: RandnAscend